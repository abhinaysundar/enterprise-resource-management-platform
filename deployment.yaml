apiVersion: apps/v1
kind: Deployment
metadata:
  name: erm-backend
  labels:
    app: erm-platform
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: erm-platform
      tier: backend
  template:
    metadata:
      labels:
        app: erm-platform
        tier: backend
    spec:
      containers:
        - name: erm-api
          image: enterprise/erm-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "erm-postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "erm_db"
            - name: SPRING_DATA_REDIS_HOST
              value: "erm-redis-service"
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
          resources:
            limits:
              cpu: "500m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: erm-backend-service
spec:
  selector:
    app: erm-platform
    tier: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erm-frontend
  labels:
    app: erm-platform
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erm-platform
      tier: frontend
  template:
    metadata:
      labels:
        app: erm-platform
        tier: frontend
    spec:
      containers:
        - name: erm-ui
          image: enterprise/erm-frontend:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: erm-frontend-service
spec:
  selector:
    app: erm-platform
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
