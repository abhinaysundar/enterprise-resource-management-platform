version: "3.8"

services:
  # ============================================================================
  # POSTGRESQL DATABASE SERVICE
  # ============================================================================
  erm-postgres:
    image: postgres:15-alpine
    container_name: erm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: erm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - erm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS CACHE SERVICE
  # ============================================================================
  erm-redis:
    image: redis:7-alpine
    container_name: erm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - erm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # SPRING BOOT BACKEND API SERVICE
  # ============================================================================
  erm-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erm-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=erm-postgres
      - DB_PORT=5432
      - DB_NAME=erm_db
      - DB_USER=postgres
      - DB_PASS=postgres
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=erm-redis
    depends_on:
      erm-postgres:
        condition: service_healthy
      erm-redis:
        condition: service_healthy
    networks:
      - erm-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/v1/actuator/health | grep UP || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================================
  # REACT + NEXT.JS FRONTEND CLIENT SERVICE
  # ============================================================================
  erm-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      erm-backend:
        condition: service_healthy
    networks:
      - erm-network

# ==============================================================================
# VOLUMES & ISOLATED NETWORKS DEFINITIONS
# ==============================================================================
volumes:
  pgdata:
    driver: local

networks:
  erm-network:
    driver: bridge
